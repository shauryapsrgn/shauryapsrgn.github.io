<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* hidden when filtered out */

const articles = [
  {
    id: "fall-of-titans",
    number: "001",
    category: "Analysis",
    date: "May 2026",
    featured: true,
    title: "The Fall of Titans: Analysing the May 2026 Elections",
    excerpt: "Tipu Sultan died on the 4th of May, 1799. Synonymously, on this date wither the legacies of decadal local parties, once considered impenetrable within their states' bastions. The aberrations set this week truly underscore the burgeoning affinity for the Saffron's administration.",
    body: `<p>Tipu Sultan, the revered opposer of the Raj, died on the 4th of May, 1799. Synonymously, albeit with even greater fervor, on this date wither the legacies of decadal local parties, once considered impenetrable within their states' bastions. The aberrations set this week truly underscore the burgeoning affinity for the Saffron's administration, a sweeping victory leaving the opposition's bulwark on its knees.</p>
<p>With the Didi's 4th term left asunder, West Bengal found its new play-thing in the BJP's first government. Tamil Nadu's Stalin and <a href="https://en.wikipedia.org/wiki/Edappadi_K._Palaniswami">Palaniswami</a> stood awestruck as their "Dravidian Duopoly" surrendered to the wrath of Vijay's newbie, the TVK. Kerala's case was no different, with the UDF kicking in with a massive comeback, on the expense of the LDF's landslide failure.</p>
<p>Simply put, the tenuous Opposition has been further weakened. Drastically, that is.</p>
<p>Grabbing the eyeballs are Kejriwal's recent feud with Delhi High Court Justice S.K. Sharma (plus the merger with BJP), consternations precipitating by the Election Commission's conduct, and the BJP's gaze now over Punjab. The coming couple of years shall seal the fate of the contemporary INDIA Bloc and its spars with the NDA's sweeping whip.</p>
<p>This election left a meagre sum of states of an already splintered Opposition at bay. Only Jharkhand, Karnataka, Telangana, Kerala, Tamil Nadu, Himachal, Mizoram, and Punjab remain un-saffronised, with 4 of these states under the 'Grand Old Party' (INC). Rest, the pearls stay stashed with the BJP's NDA.</p>
<p>The pertinent question that arises in every liberal's head is simply this. How? I seek to answer precisely this dilemma, encasing the ingenuity of the BJP's political strategic penetration of opposition helms in a nutshell, while concomitantly underscoring these opposition-CMs' horrid slips.</p>
<p>I'll start with the biggest shocker of this election, i.e., the oust of Mamata Banerjee from the state residency. Prima Facie the Didi should've swept this election without much trouble. 2021 marked her largest landslide against the BJP, with a mark of 215 under the TMC's feather, in contrast to the BJP's mere 77. 2026 quite literally turned the tables around, with the BJP at 206 and Mamata at 81.</p>
<p>But look at these numbers. The BJP's vote share was 38% in 2021, 39% in 2024, and 45% in 2026. The vote-share trends seem to have steadily increased, not drastically, with the only difference cited being the anti-incumbency vote now completely garnered by the BJP and not its sister opposition parties trotting in the same race (conspicuously, the mere 2 seat margin won by the INC).</p>
<p>Structurally, the TMC's formidable electoral machine, despite 30% of the polling booths not covered by it, lost to the BJP's far disadvantaged position. Citing the Election Commission's SIR exercise, at least in the Supreme Court's implicit understanding, is nothing more than an obstruction of a Constitutional practice, one that is fundamentally unbiased. However, that's a debate for another day.</p>
<p>One major scandal that took the TMC by the jaws was the SCC Case, with an estimated 400+ Crore valuation. Despite the contents of the scam and the Court's verdict, Mamata continued to rally high-profile accused members in her 2024 campaign — something the Opposition juiced vehemently.</p>
<p>Additionally, the R.G. Kar Case and the Matri Shakti Vandan Yojana in tandem eroded the 'Didi' status of Mamata, leaving her without the women vote bank she had cherished for a decade and a half. The former's mother, Ratna Debnath, won in the Panihati Constituency, vowing to avenge her daughter's murder through Didi's defeat. The latter, on the other hand, effectively turned the Lakshmir Bhandar obsolete.</p>
<p>And, of course, the Gunda Raj, Nepotism, and Syndicate Politics. The most conspicuous of the musketeers. So, to sum up, Mamata's defeat was not uncalled for. Rather, the BJP had been placing the sheets since 2021. In 2026, the Leader of Opposition's seat stood vacant for the former-Didi to take over.</p>
<p>Only fate can construe if she can ever recover from such a gloomy loss at the state elections.</p>
<p>The second shocker was the Dravidian Binary's defeat against film-star Vijay, the newbie TVK's founder. To be fair, I underestimated this man. It is since 1967 that a party other than the Dravidians have ruled this South Indian state, simultaneously making him the state's first Christian Chief Minister. The failure of the Dravidians' political structure and planning is what I seek to emphasise here.</p>
<p>The defection of O. Panneerselvam to the formerly-ruling DMK, and Palaniswami's confusing alliance with the NDA only marred the winning case for both the feuding parties. The AIADMK's internecine bloodletting, in essence, was a gift wrapped for Vijay. Palaniswami's NDA flirtation, ideologically jarring for a party rooted in Dravidian social justice and anti-Brahminism, chased away precisely the secular and minority vote he needed to consolidate.</p>
<p>That the BJP itself managed a solitary seat despite the formal alliance tells the whole story of what the pact was worth. And Stalin's studied silence on Vijay, a sort of deliberate stratagem to deny the upstart oxygen, seemed to only fan the flames. The media vacuum that the DMK refused to fill, TVK occupied wholesale. And the results are a testament to them.</p>
<p>The arithmetic, hence, delivered its verdict. A 34.92% debut in a three-way race, under FPTP (first-past-the-post), was all Vijay needed. The Dravidians, splitting the residual 45% between them in constituency after constituency, handed him the throne by their own mutual consumption. C.N. Annadurai's spirit must've watched with bemusement.</p>
<p>The third, and perhaps most historically resonant, collapse was that of the Left in Kerala. The last of the Left in all of India. Pinarayi Vijayan, 81, sought a third consecutive term, a feat no southern Chief Minister has achieved in the modern democratic era. The electorate, obligingly, reminded him why that was the case. The UDF's (approx.) 95-seat haul, against the LDF's catastrophic 43, marks the extinguishing of the last ember of Communist governance in India, a distinction the country last held in 1977.</p>
<p>Vijayan's undoing was, peculiarly, of his own making. The 2021 victory, extraordinary in its own right — the first consecutive second term in Kerala's history — was secured on the back of COVID governance so commendable it earned international admiration. The podium briefings at 6 p.m., the flattening of the curve, the KK Shailaja phenomenon. Yet it was Shailaja herself whom Vijayan quietly sidelined before the 2021 campaign, unwilling, it would seem, to share the limelight with a colleague who'd eclipsed him in the public imagination.</p>
<p>That decision, read as Stalinist even by sympathisers, planted the first seeds of discontent among the Left's own constituency.</p>
<p>What germinated over the subsequent five years was a cascade. The Gold Smuggling Case, drawing Vijayan's own Principal Secretary into its net. The Sprinklr data row. The cooperative banking irregularities. The KIIFB's off-budget opacity. Piece by piece, the CPI(M)'s foundational moral authority — its central electoral asset, its differentiation from a Congress perennially accused of graft — was simply, and amazingly, stripped away.</p>
<p>Vijayan's defiant posture in the face of each accusation, whatever its legal merit, came across as nothing but imperious dismissal of accountability. An 81-year-old man seeking a third term, surrounded by controversies and a party hollowed of successor talent, asking Kerala for yet more patience.</p>
<p>Kerala did not oblige.</p>
<p>The rump of un-saffronised India — Jharkhand, Karnataka, Telangana, Kerala, Tamil Nadu, Himachal, Mizoram, Punjab — is smaller still, and internally incoherent. A TVK that is neither opposition nor ally. A Kerala UDF whose Congress anchor cannot quite claim credit for a win delivered by the LDF's implosion. A Himachal and Karnataka that remain perpetually contested.</p>

    body: `<p>The Supreme Court of India has delivered what may well be remembered as the most consequential constitutional rebuke to gubernatorial overreach in the republic's history.</p>

    excerpt: "The Waqf (Amendment) Act, 2025 passed in a Parliament characterised by near-complete Opposition absence. Four provisions of the Act warrant particular constitutional scrutiny.",
    body: `<p>The Waqf (Amendment) Act, 2025 passed in a Parliament characterised by near-complete Opposition absence — a procedural circumstance that does not, of itself, render the legislation invalid, but which ought to heighten the scrutiny applied to its substance. That scrutiny, applied honestly, reveals provisions that are difficult to reconcile with constitutional principle.</p>
<p>Four provisions warrant particular attention.</p>
<p>The first is the redefinition of waqf by user. The existing law recognises properties as waqf on the basis of long, uninterrupted use for religious or charitable purposes — a doctrine rooted in Muslim personal law and affirmed across decades of judicial precedent. The Amendment substantially narrows this doctrine, requiring formal documentation as a precondition for recognition. For properties endowed centuries before the modern administrative apparatus existed, this is a standard they cannot practically meet. The effect, whether intended or not, is the prospective de-recognition of established religious endowments.</p>
<p>The second concerns the composition of the Central Waqf Council and State Waqf Boards. The Amendment mandates the inclusion of non-Muslim members — including two women, which is welcome — but goes further, permitting non-Muslims to hold positions in institutions established specifically for the administration of Muslim charitable endowments. The analogy to equivalent Hindu endowment boards, from which non-Hindus are constitutionally and statutorily excluded, is one the legislative drafters have not adequately addressed.</p>
<p>The third provision, and perhaps the most operationally consequential, concerns the Survey Commissioner. The Amendment transfers authority over disputed waqf property surveys from dedicated Waqf officers to general revenue officials. This is not a technical administrative rearrangement. Waqf property surveys require specialist knowledge of both religious endowment law and the historical documentation practices of Muslim communities. Substituting generalist officials introduces both competence deficits and new vectors for political interference at the district level.</p>
<p>The fourth issue is the limitation on judicial review. Certain determinations under the amended Act are insulated from challenge before civil courts, with remedies channelled exclusively through tribunals whose composition and independence the Amendment itself modifies. The Supreme Court has repeatedly held that the right to approach a court of law is a basic feature of the Constitution. Legislation that curtails this right, even in the service of administrative efficiency, invites constitutional challenge on those grounds.</p>
<p>None of this is to suggest that the Waqf Act required no reform. The administration of waqf properties in India has been marked, in too many instances, by opacity, encroachment, and the self-dealing of those entrusted with their stewardship. A legislature that chose to address these failures — through transparent accounting requirements, independent auditing, and strengthened beneficiary rights — would have found constitutional ground to stand on.</p>
<p>This Amendment chose a different path. The constitutional courts will determine whether it is a path the republic's foundational document permits.</p>`

    id: "right-to-be-forgotten",

    title: "The Right to Be Forgotten: India's Unfinished Constitutional Conversation",
    excerpt: "The Digital Personal Data Protection Act, 2023 acknowledges the right to erasure — but the gap between legislative acknowledgment and operational reality is, in India's case, a chasm.",
    body: `<p>In August 2017, a nine-judge bench of the Supreme Court of India affirmed privacy as a fundamental right under Article 21. That judgment, Puttaswamy v. Union of India, was in many respects a constitutional watershed. It was also, in respect of the right to be forgotten, a promissory note — one whose encashment has proven considerably more complicated than its issuance.</p>
<p>The Digital Personal Data Protection Act, 2023 acknowledges the right to erasure. A data principal may, in defined circumstances, request that a data fiduciary erase personal data that is no longer necessary for the purpose for which it was collected. The provision is real. The gap between legislative acknowledgment and operational reality is, in India's case, a chasm.</p>
<p>Consider the position of an individual whose name appears in a newspaper archive for a minor criminal matter that did not result in conviction — or for which the individual has served their sentence and been discharged. The newspaper's digital edition is indexed by every major search engine. The individual's name, on a simple search, surfaces the article. Prospective employers, landlords, and social acquaintances encounter it. The person has, in the formal sense, served their debt to society. In the digital sense, they serve it in perpetuity.</p>
<p>The DPDP Act's erasure provisions do not straightforwardly reach this situation. The newspaper is a data fiduciary, but the publication of news is exempted from the Act's provisions to the extent necessary for journalistic purposes. Search engines are intermediaries, not necessarily data fiduciaries in relation to this specific content. The individual's remedy, if any, requires either voluntary compliance or litigation — the outcome of which, in India's under-resourced court system, is neither swift nor certain.</p>
<p>The European experience offers partial instruction. The Court of Justice of the European Union's ruling in Google Spain established, in 2014, that individuals could require search engines to de-index links to personal information that was inadequate, irrelevant, or excessive in relation to the purposes of data processing. This created a workable, if imperfect, administrative mechanism: a request-and-review process handled at the platform level, subject to judicial oversight.</p>
<p>India has no equivalent mechanism. The DPDP Act's redressal framework is in its implementation infancy. The Data Protection Board is not yet constituted. The Rules that will operationalise the Act's provisions have not been finalised.</p>
<p>In the interim, individuals seeking to be forgotten must approach the High Courts under Article 226 — a remedy theoretically available, practically arduous, and jurisprudentially inconsistent. Different High Courts have reached different conclusions on the balancing of privacy against the public's right to information, without a supervening framework to reconcile them.</p>
<p>The right to be forgotten is not an absolute right. It has never been so, not even in Europe. It is a right that must be weighed against press freedom, historical record, and the public interest in accountability. But a right that can only be exercised through High Court litigation is, for most Indians, not a right at all. It is a privilege available to those with means and legal representation.</p>
<p>The constitutional conversation that Puttaswamy began is unfinished. The DPDP Act has sketched the outline. The substance of the right — its scope, its limits, its enforcement mechanism — remains to be filled in. The longer that task is deferred, the more names accumulate in archives that their bearers cannot escape.</p>`

    id: "press-freedom-index",
    number: "005",

    featured: false,
    title: "On Press Freedom Rankings and What They Actually Measure",
    excerpt: "India's rank on the RSF World Press Freedom Index has become an annual occasion for two entirely predictable responses — the government dismisses it, and the opposition amplifies it. Neither engages with what the index actually measures.",
    body: `<p>India's rank on the RSF World Press Freedom Index has become an annual occasion for two entirely predictable responses. The government dismisses it as motivated, methodologically flawed, and compiled by organisations with an ideological agenda. The opposition amplifies it as damning evidence of democratic backsliding. Neither response engages, with any seriousness, with what the index actually measures or what its limitations are.</p>
<p>The RSF index assesses press freedom across five indicators: the political context, the legal framework, the economic context, the sociocultural context, and safety. The methodology relies substantially on questionnaires completed by journalists and press freedom correspondents — a design that introduces, alongside genuine insight, the risk of systematic bias in sampling. Countries with better-organised and more internationally connected journalist communities may score differently from countries where the press operates in comparable conditions but with less visibility to global NGOs.</p>
<p>This is not an argument that India's ranking is wrong. The conditions that bear on Indian press freedom — the ownership concentration in media, the deployment of defamation and sedition provisions against journalists, the treatment of reporters in conflict zones such as Manipur and Kashmir, the economic vulnerability of regional-language press to government advertising revenue — are documented, verifiable, and serious. They do not require the endorsement of a Paris-based organisation to be real.</p>
<p>What the RSF ranking does not do is provide a causal account. It records an outcome, not a mechanism. It does not distinguish between press freedom constrained by legal architecture, press freedom constrained by private ownership patterns, and press freedom constrained by physical danger to journalists. These distinctions matter enormously for policy, even if they matter little for a single composite number.</p>
<p>The government's reflexive dismissal is, in this respect, a missed opportunity. A state confident in its record would engage with the specific indicators on which India scores poorly and contest them on the evidence — or, if the evidence is correct, address the underlying conditions. Dismissal as a strategy is, among other things, an implicit concession that engagement would be uncomfortable.</p>
<p>The opposition's uncritical amplification is equally unserious. A ranking is a starting point for a conversation, not a substitute for one. The deterioration in India's ranking spans administrations, reflects structural features of the Indian media economy that predate the current government, and includes dimensions — such as the vulnerability of small-press journalists to local criminal and political pressure — that no national government of any stripe has seriously addressed.</p>
<p>The press freedom conversation India needs is more granular, more honest, and more uncomfortable than either the government or the opposition currently appears willing to have.</p>`

    body: `<p>The Supreme Court's December 2023 judgment upholding the abrogation of Article 370 resolved the constitutional question — or deferred it, depending on one's reading of the majority opinion's more elliptical passages. What it did not resolve, and what no court can resolve, is the political and administrative reality that has followed five years of direct central rule over what was once India's only Muslim-majority state.</p>
<p>The Court held that the President's proclamation under Article 356, and the subsequent legislative actions taken by Parliament while Jammu & Kashmir was under President's Rule, were constitutionally valid. The Court also held — and this is the element that has received insufficient attention in subsequent commentary — that the bifurcation of the state into two Union Territories was an exceptional measure, and that statehood should be restored.</p>
<p>That direction has not been acted upon with any discernible urgency. Jammu & Kashmir remains a Union Territory, governed by an elected assembly since November 2024 but with a Lieutenant Governor whose powers, under the current constitutional arrangement, substantially constrain the elected government's authority. The National Conference-led government finds itself in a structural position not entirely unlike that of the AAP government in Delhi — elected but not fully sovereign, governing but not governing.</p>
<p>The unresolved questions are several. First, the timeline for statehood restoration. The Union government has made commitments; it has not made a calendar. Each passing month of UT status entrenches administrative arrangements, service cadres, and institutional structures that will be more difficult to unwind. The longer the restoration is deferred, the more the deferral itself becomes the reality.</p>
<p>Second, the political status of Kashmiris who were stripped of special privileges — including the right to buy land in the territory — that the old Article 35A framework had conferred. The economic consequences of that change, particularly in respect of land ownership and employment in state services, are still working themselves through Kashmiri society. They were not addressed by the Supreme Court's judgment and are unlikely to be addressed through judicial intervention.</p>
<p>Third, and most substantially, the question of political normalisation. The 2024 assembly election was conducted, votes were cast, and a government was formed. These are not trivial achievements in a region that has experienced what Jammu & Kashmir has experienced. They are also not sufficient evidence that the underlying political estrangement — of significant portions of the Valley's population from the Indian constitutional project — has been resolved rather than suppressed.</p>
<p>Suppression and resolution look identical in the short run. They diverge, often sharply, over time.</p>`

<p>Viksit Bharat Guarantee for Rozgar and Ajeevika Mission (Gramin) Bill, 2025, abbreviated "VK G-RAM-G", has recently been tabled in Parliament, ought to set apart the former MGNREGA Framework, while instating a new rural job guarantee initiative, 20 years after the former.</p>

<p>This is the headline of the hour. 25 more days for everyone. Looks lovely on paper, till you realise how baseless these numbers look on graphs. The minimum-100-day MGNREGA Scheme barely achieved its targets in most states, and here we are, at the Parliament, inducting a delusionally written charter, to put colloquially. Switching 100 days to 125 won't change the Union's 50–60 averaged apathy.</p>

<p>40 percent paid entirely by the State. Additionally, unemployment allowances, state council costs, and a quarter of material costs all fall under the ambit of the states' treasury. Essentially, what this heralds is a more constrained, opposition-run states' relationship, meanwhile the Union allows its ruling-states uninterrupted cashflow. Political bargaining is what will run our governments in the coming years.</p>

/* ═══ BUILD FILTER BUTTONS ═══ */
function buildFilters() {
  const bar = document.getElementById('filterBar');
  const cats = [...new Set(articles.map(a => a.category))];
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.onclick = function() { filterBy(cat, this); };
    bar.appendChild(btn);
  });
}

let currentFilter = 'all';
function filterBy(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  const featured = document.getElementById('featuredPiece');
  const rows = document.querySelectorAll('.writing-row');
  const noResults = document.getElementById('noResults');
  let visibleCount = 0;

  if (featured) {
    const match = cat === 'all' || featured.dataset.cat === cat;
    featured.classList.toggle('filtered-out', !match);
    if (match) visibleCount++;
  }
  rows.forEach(row => {
    const match = cat === 'all' || row.dataset.cat === cat;
    row.classList.toggle('filtered-out', !match);
    if (match) visibleCount++;
  });
  noResults.style.display = visibleCount === 0 ? 'block' : 'none';
}

/* ═══ RENDER ═══ */
function render() {
  const list = document.getElementById('writingList');
  const count = document.getElementById('headerCount');
  count.textContent = articles.length + ' piece' + (articles.length !== 1 ? 's' : '');

  const featured = articles.find(a => a.featured);
  const rest = articles.filter(a => !a.featured);

  // Featured card
  if (featured) {
    const fi = articles.indexOf(featured);
    const el = document.createElement('a');
    el.href = '#';
    el.id = 'featuredPiece';
    el.className = 'writing-featured reveal';
    el.dataset.cat = featured.category;
    el.setAttribute('aria-label', 'Read: ' + featured.title);
    el.innerHTML = `
      <div class="wf-left">
        <div>
          <span class="wf-badge">Featured</span>
          <p class="wf-category">${featured.category}</p>
          <h2 class="wf-title">${featured.title}</h2>
          <p class="wf-excerpt">${featured.excerpt}</p>
        </div>
        <div class="wf-footer">
          <span class="wf-date">${featured.date}</span>
          <span class="wf-arrow">→</span>
        </div>
      </div>
      <div class="wf-right">
        <div class="wf-number">${featured.number}</div>
      </div>`;
    el.addEventListener('click', e => { e.preventDefault(); openArticle(fi); });
    list.appendChild(el);
  }

  // Divider
  const div = document.createElement('div');
  div.className = 'list-divider reveal';
  div.innerHTML = `<div class="list-divider-line"></div><span class="list-divider-label">All Pieces</span><div class="list-divider-line"></div>`;
  list.appendChild(div);

  // List rows
  rest.forEach(a => {
    const idx = articles.indexOf(a);
    const row = document.createElement('a');
    row.href = '#';
    row.className = 'writing-row reveal';
    row.dataset.cat = a.category;
    row.setAttribute('aria-label', 'Read: ' + a.title);
    row.innerHTML = `
      <span class="wr-num">${a.number}</span>
      <div class="wr-body">
        <span class="wr-cat">${a.category}</span>
        <span class="wr-title">${a.title}</span>
        <span class="wr-excerpt">${a.excerpt}</span>
        <span class="wr-date-inline">${a.date}</span>
      </div>
      <div class="wr-meta">
        <span class="wr-date">${a.date}</span>
        <span class="wr-arrow">→</span>
      </div>`;
    row.addEventListener('click', e => { e.preventDefault(); openArticle(idx); });
    list.appendChild(row);
  });
}

/* ═══ ARTICLE READER ═══ */
function openArticle(index) {
  const a = articles[index];
  const words = a.body.replace(/<[^>]+>/g, '').split(/\s+/).length;
  const mins = Math.max(1, Math.round(words / 200));
  document.getElementById('articleCategory').textContent = a.category;
  document.getElementById('articleTitle').textContent = a.title;
  document.getElementById('articleDate').textContent = a.date;
  document.getElementById('articleReadTime').textContent = mins + ' min read';
  document.getElementById('articleBody').innerHTML = a.body;
  const overlay = document.getElementById('articleOverlay');
  overlay.classList.add('open');
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeArticle() {
  document.getElementById('articleOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeArticle(); });

/* ═══ SCROLL REVEAL ═══ */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

/* ═══ INIT ═══ */
buildFilters();
render();
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
